name: Test and validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install 'fastapi>=0.111,<1' 'uvicorn>=0.30,<1' 'pydantic>=2,<3' pytest
      - name: Compile sources
        run: python -m compileall -q lifetable.py life_table.py cli.py agents enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser code
        run: node --check web/app.js
      - name: Run browser calculation tests
        run: node --test web/test-app.mjs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t lifetable-constructor:test .
